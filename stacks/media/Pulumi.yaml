name: orangelab-media
main: index.ts
runtime:
    name: nodejs
    options:
        typescript: true
        packagemanager: npm
description: OrangeLab Media Stack
config:
    # Required shared defaults (duplicated from root Pulumi.yaml)
    # orangelab:routingProvider: tailscale | traefik
    cloudnative-pg:enabled: false
    # longhorn:backupAllVolumes: false # read from the core stack by default

    ### Media ###

    immich:enabled: false
    immich:hostname: immich
    immich:image: ghcr.io/immich-app/immich-server:v3.2.0
    immich:storageSize: 50Gi
    immich:trustedProxies: '10.42.0.0/16,10.43.0.0/16' # clusterCidr,serviceCidr
    immich:machine-learning/enabled: false
    immich:machine-learning/image: ghcr.io/immich-app/immich-machine-learning:v3.2.0
    immich:machine-learning/storageSize: 10Gi
    immich:redis/image: docker.io/valkey/valkey:9@sha256:546304417feac0874c3dd576e0952c6bb8f06bb4093ea0c9ca303c73cf458f63
    immich:db/storageSize: 5Gi
    immich:db/image: ghcr.io/tensorchord/cloudnative-vectorchord:18.2
    immich:db/sharedPreloadLibraries: vchord.so
    immich:db/postInitApplicationSQL: CREATE EXTENSION IF NOT EXISTS earthdistance CASCADE,CREATE EXTENSION IF NOT EXISTS vchord CASCADE
    immich:smtp/enabled: false
    # immich:smtp/host: smtp.example.com
    # immich:smtp/from: noreply@example.com
    # immich:smtp/username: user
    # immich:smtp/password:
    #   secure: <SMTP_PASSWORD>
    immich:smtp/port: 587
    immich:smtp/secure: starttls

    # Define shared volume (hostPath)
    # jellyfin-media:hostPath: /mnt/my-drive/media
    # Define shared volume (Longhorn)
    # jellyfin-media:fromVolume: jellyfin-media
    # jellyfin-media:storageSize: 1000Gi

    jellyfin:enabled: false
    jellyfin:hostname: jellyfin
    jellyfin:image: jellyfin/jellyfin:latest
    jellyfin:storageSize: 5Gi
    # App-specific settings for local media volume
    # jellyfin:media/hostPath: /mnt/my-drive/media
    # or reference to volume config
    # jellyfin:media: jellyfin-media

    lidarr:enabled: false
    lidarr:hostname: lidarr
    lidarr:image: lscr.io/linuxserver/lidarr:latest
    lidarr:storageSize: 1Gi
    # lidarr:media: jellyfin-media

    droppedneedle:enabled: false
    droppedneedle:hostname: droppedneedle
    droppedneedle:image: ghcr.io/droppedneedle/droppedneedle:latest
    droppedneedle:storageSize: 1Gi
    # droppedneedle:media: jellyfin-media
    droppedneedle:SLSKD_DOWNLOADS_PATH: /media/slskd-downloads

    prowlarr:enabled: false
    prowlarr:hostname: prowlarr
    prowlarr:image: lscr.io/linuxserver/prowlarr:latest
    prowlarr:storageSize: 1Gi

    radarr:enabled: false
    radarr:hostname: radarr
    radarr:image: lscr.io/linuxserver/radarr:latest
    radarr:storageSize: 1Gi
    # radarr:media: jellyfin-media

    slskd:enabled: false
    slskd:hostname: slskd
    slskd:image: slskd/slskd:0.25.1
    slskd:storageSize: 1Gi
    # slskd:web/password: slskd # secret auto-generated by default
    # slskd:media: jellyfin-media
    slskd:SLSKD_DOWNLOADS_DIR: /media/slskd-downloads
    slskd:SLSKD_SHARED_DIR: /media/music

    sonarr:enabled: false
    sonarr:hostname: sonarr
    sonarr:image: lscr.io/linuxserver/sonarr:latest
    sonarr:storageSize: 1Gi
    # sonarr:media: jellyfin-media

    seerr:enabled: false
    seerr:hostname: seerr
    seerr:image: ghcr.io/seerr-team/seerr:latest
    seerr:storageSize: 1Gi

    transmission:enabled: false
    transmission:hostname: transmission
    transmission:image: lscr.io/linuxserver/transmission:latest
    transmission:storageSize: 1Gi
    # transmission:media: jellyfin-media
