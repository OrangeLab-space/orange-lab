name: orangelab-ai
main: index.ts
runtime:
    name: nodejs
    options:
        typescript: true
        packagemanager: npm
description: OrangeLab AI Stack
config:
    # Required shared defaults (duplicated from root Pulumi.yaml)
    # orangelab:routingProvider: tailscale | traefik
    # orangelab:coreStackRef: <organization/project/stack>
    prometheus:enabled: false
    prometheus:enableComponentMonitoring: false
    cloudnative-pg:enabled: false
    mariadb-operator:enabled: false
    # longhorn:backupAllVolumes: false # read from the core stack by default

    ollama:enabled: false
    ollama:hostname: ollama
    ollama:storageSize: 50Gi
    ollama:storageOnly: false
    ollama:storageClass: longhorn-gpu
    # Set to 'nvidia', 'amd' or 'intel' to enable GPU support, Use '' for CPU-only mode
    ollama:gpu: nvidia
    # ollama:HSA_OVERRIDE_GFX_VERSION: "11.0.2"
    # ollama:HCC_AMDGPU_TARGETS: "gfx1103"
    # ollama:models: qwen2.5-coder:1.5b,glm-4.7-flash
    # "-1" = keep models loaded indefinitely, "30m" unload after 30 minutes of inactivity
    ollama:OLLAMA_KEEP_ALIVE: '-1'
    # LLM parameter tuning
    ollama:OLLAMA_CONTEXT_LENGTH: '8192'
    # ollama:OLLAMA_FLASH_ATTENTION: 'true'
    # ollama:OLLAMA_KV_CACHE_TYPE: 'q8_0' # f16, q8_0, q4_0
    # Enable if ollama drops integrated GPU (iGPU). Set to "1" to use iGPU
    # ollama:OLLAMA_IGPU_ENABLE: "1"
    # Deploys to any node with selected GPU if requiredNodeLabel NOT specified
    # ollama:requiredNodeLabel: kubernetes.io/hostname=<host>

    agentgateway:enabled: false
    agentgateway:hostname: agentgateway
    agentgateway:hostname-llm: ai
    agentgateway:version: v1.7.0
    # Map of provider name to {baseUrl, models}; auth uses <provider>/apiKey secrets
    # agentgateway:providers: see components/agentgateway/agentgateway.md
    # Cost rates per model for analytics; see components/agentgateway/agentgateway.md
    # agentgateway:modelCosts: map of providers/models/rates
    # Virtual models: map name to {strategy, targets: [{model, priority|weight}]}
    # agentgateway:virtualModels: see components/agentgateway/agentgateway.md
    # Virtual keys generated per client, exposed in apps.agentgateway.apiKeys
    agentgateway:clients: default
    # agentgateway:auth: pocket
    # agentgateway:auth/clientId: CLIENT_ID
    # agentgateway:auth/clientSecret: CLIENT_SECRET
    # agentgateway:auth/allowedGroups: admin
    # agentgateway:network/public: false

    speaches:enabled: false
    speaches:sttModel: Systran/faster-whisper-base
    speaches:ttsModel: speaches-ai/Kokoro-82M-v1.0-ONNX
    speaches:ttsVoice: af_heart
    speaches:image: ghcr.io/speaches-ai/speaches:0.9.0-rc.3-cpu
    speaches:nvidia/image: ghcr.io/speaches-ai/speaches:0.9.0-rc.3-cuda
    speaches:storagePath: /srv/speaches-cache
    # Node-local model cache lives on this node; moving nodes re-downloads the models.
    # speaches:requiredNodeLabel: kubernetes.io/hostname=<host>
    # speaches:gpu: nvidia  # selects speaches:nvidia/image

    automatic1111:enabled: false
    automatic1111:hostname: 'automatic1111'
    automatic1111:image: universonic/stable-diffusion-webui:full
    automatic1111:cliArgs: '--lowvram'
    automatic1111:storageSize: 20Gi
    automatic1111:storageOnly: false
    automatic1111:storageClass: longhorn-gpu
    automatic1111:gpu: nvidia

    sdnext:enabled: false
    sdnext:hostname: 'sdnext'
    sdnext:image: saladtechnologies/sdnext:base
    sdnext:cliArgs: '--lowvram'
    sdnext:storageSize: 20Gi
    sdnext:storageOnly: false
    sdnext:storageClass: longhorn-gpu
    sdnext:gpu: nvidia

    open-webui:enabled: false
    open-webui:hostname: webui
    open-webui:storageSize: 5Gi
    open-webui:DEFAULT_USER_ROLE: user
    # true stores admin-UI config changes in the volume; false keeps Pulumi settings authoritative
    open-webui:ENABLE_PERSISTENT_CONFIG: false
    open-webui:image: ghcr.io/open-webui/open-webui:main-slim
    # Model backends are configured in the Admin UI. When agentgateway is enabled,
    # its OpenAI-compatible endpoint is connected automatically.
    # Pocket ID groups allowed to sign in (unset = unrestricted)
    open-webui:auth/allowedGroups: admin,open-webui-users
    # open-webui:debug: false
    # OIDC (OAuth) login. Set open-webui:auth to an OIDC provider to enable (currently: pocket).
    # Requires orangelab:coreStackRef pointing at a core stack with the provider enabled.
    # open-webui:auth: pocket
    # open-webui:auth/clientId: CLIENT_ID
    # open-webui:auth/clientSecret: CLIENT_SECRET
    # open-webui:auth/providerUrl: https://pocket.example.com/.well-known/openid-configuration  # optional override; defaults to the core stack's provider export
    # open-webui:auth/providerName: SSO  # optional; label the login button, defaults to "SSO"

    kubeai:enabled: false
    kubeai:hostname: kubeai
    # Per-node model PVCs, separate from the Ollama volume
    kubeai:modelStoragePath: /srv/kubeai-models
    # Per-node model hosts: storage size and GPU env; see components/kubeai/kubeai.md
    # kubeai:modelNodes:
    #     <node>: {storageSize: 50Gi, env: {HSA_OVERRIDE_GFX_VERSION: '11.0.0'}}
    # kubeai:huggingfaceToken: TOKEN
    # Ollama model server and loader image
    kubeai:ollama/image: ollama/ollama:0.40.12-rocm
    # kubeai:llamacpp/image: ghcr.io/ggml-org/llama.cpp:server-vulkan-b10680
    # kubeai:vllm/image: <image>

    invokeai:enabled: false
    invokeai:hostname: 'invokeai'
    invokeai:image: ghcr.io/invoke-ai/invokeai:latest
    invokeai:amd/image: ghcr.io/invoke-ai/invokeai:main-rocm
    invokeai:storageSize: 20Gi
    invokeai:storageClass: longhorn-gpu
    invokeai:gpu: nvidia
    # Pocket ID groups allowed to sign in (unset = unrestricted)
    invokeai:auth/allowedGroups: admin,invokeai-admin
    # invokeai:huggingfaceToken: TOKEN

    n8n:enabled: false
    n8n:hostname: n8n
    n8n:image: docker.n8n.io/n8nio/n8n:latest
    # n8n:N8N_ENCRYPTION_KEY: ''
    n8n:storageSize: 1Gi
    n8n:db/storageSize: 1Gi
    n8n:db/instances: 1
    # Database cpu and memory requests and limits, overriding the library default.
    # n8n:db/resources:
    #     value: {requests: {memory: 1Gi}, limits: {memory: 2Gi}}
    # Pocket ID groups allowed to sign in (unset = unrestricted)
    n8n:auth/allowedGroups: admin,n8n-users
