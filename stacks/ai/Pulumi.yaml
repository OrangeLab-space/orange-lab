name: orangelab-ai
main: index.ts
runtime:
    name: nodejs
    options:
        typescript: true
        packagemanager: npm
description: OrangeLab AI Stack
config:
    # Required shared defaults (duplicated from root Pulumi.yaml)
    # orangelab:routingProvider: tailscale | traefik
    # orangelab:coreStackRef: <organization/project/stack>
    prometheus:enabled: false
    prometheus:enableComponentMonitoring: false
    cloudnative-pg:enabled: false
    mariadb-operator:enabled: false
    # longhorn:backupAllVolumes: false # read from the core stack by default

    ollama:enabled: false
    ollama:hostname: ollama
    ollama:storageSize: 50Gi
    ollama:storageOnly: false
    ollama:storageClass: longhorn-node-local
    # Set to 'nvidia', 'amd' or 'intel' to enable GPU support, Use '' for CPU-only mode
    ollama:gpu: nvidia
    # ollama:HSA_OVERRIDE_GFX_VERSION: "11.0.2"
    # ollama:HCC_AMDGPU_TARGETS: "gfx1103"
    # ollama:models: qwen2.5-coder:1.5b,glm-4.7-flash
    # "-1" = keep models loaded indefinitely, "30m" unload after 30 minutes of inactivity
    ollama:OLLAMA_KEEP_ALIVE: '-1'
    # LLM parameter tuning
    ollama:OLLAMA_CONTEXT_LENGTH: '8192'
    # ollama:OLLAMA_FLASH_ATTENTION: 'true'
    # ollama:OLLAMA_KV_CACHE_TYPE: 'q8_0' # f16, q8_0, q4_0
    # Enable if ollama drops integrated GPU (iGPU). Set to "1" to use iGPU
    # ollama:OLLAMA_IGPU_ENABLE: "1"
    # Deploys to any node with selected GPU if requiredNodeLabel NOT specified
    # ollama:requiredNodeLabel: kubernetes.io/hostname=<host>
    #
    # Tolerate a tainted GPU node (NVIDIA nodes are targeted by the NFD gpu label)
    # ollama:tolerations: orangelab/dedicated=<role>:NoSchedule

    agentgateway:enabled: false
    agentgateway:hostname: agentgateway
    agentgateway:hostname-llm: ai
    agentgateway:version: v1.7.0
    # Map of provider name to {baseUrl, models}; auth uses <provider>/apiKey secrets
    # agentgateway:providers: see components/agentgateway/agentgateway.md
    # Cost rates per model for analytics; see components/agentgateway/agentgateway.md
    # agentgateway:modelCosts: map of providers/models/rates
    # Virtual models: map name to {strategy, targets: [{model, priority|weight}]}
    # agentgateway:virtualModels: see components/agentgateway/agentgateway.md
    # Upstream request headers, used only when the client sends none; a client
    # value wins. OpenCode Go models need x-opencode-session from non-agent clients.
    # agentgateway:requestHeaders: map of header name to value
    # Virtual keys generated per client, exposed in apps.agentgateway.apiKeys
    agentgateway:clients: default
    # agentgateway:auth: pocket
    # agentgateway:auth/clientId: CLIENT_ID
    # agentgateway:auth/clientSecret: CLIENT_SECRET
    # agentgateway:auth/allowedGroups: admin
    # agentgateway:network/public: false

    speaches:enabled: false
    speaches:sttModel: Systran/faster-whisper-base
    speaches:ttsModel: speaches-ai/Kokoro-82M-v1.0-ONNX
    speaches:ttsVoice: af_heart
    speaches:image: ghcr.io/speaches-ai/speaches:0.9.0-rc.3-cpu
    speaches:nvidia/image: ghcr.io/speaches-ai/speaches:0.9.0-rc.3-cuda
    speaches:storagePath: /srv/speaches-cache
    # Node-local model cache lives on this node; moving nodes re-downloads the models.
    # speaches:requiredNodeLabel: kubernetes.io/hostname=<host>
    # speaches:gpu: nvidia  # selects speaches:nvidia/image

    comfyui:enabled: false
    comfyui:hostname: comfyui
    comfyui:image: yanwk/comfyui-boot:cpu
    comfyui:nvidia/image: yanwk/comfyui-boot:cu130-slim-v2
    comfyui:amd/image: yanwk/comfyui-boot:rocm
    comfyui:intel/image: yanwk/comfyui-boot:xpu
    comfyui:storagePath: /srv/comfyui-models
    # Node-local model cache. requiredNodeLabel must select the node that hosts it;
    # moving nodes starts with an empty cache and downloads the models again.
    # comfyui:requiredNodeLabel: kubernetes.io/hostname=<host>
    comfyui:gpu: nvidia
    # Extra ComfyUI CLI args, e.g. --lowvram on small GPUs.
    # comfyui:cliArgs: '--lowvram'
    # AMD only: override the ROCm chipset when it is not detected.
    # comfyui:HSA_OVERRIDE_GFX_VERSION: '11.5.0'
    #
    # Model bundle Open WebUI runs: a JSON file with the ComfyUI API workflow,
    # model name, node mapping and files to download. Bundled examples live in
    # components/comfyui/models; relative paths resolve from stacks/ai.
    comfyui:modelFile: components/comfyui/models/flux2-klein-4b.json
    # Other bundled models: replace the line above with one of these.
    #   z-image-turbo.json     Z-Image Turbo, 8 steps, ~41s warm
    #   qwen-image-2.1.json    Qwen-Image 2.1, 25 steps, stronger text rendering
    #   flux1-dev.json         Flux.1 dev fp8, 20 steps, minutes on integrated
    #                          GPUs; also set comfyui:cliArgs to --fp8_e4m3fn-unet

    open-webui:enabled: false
    open-webui:hostname: webui
    open-webui:storageSize: 5Gi
    open-webui:DEFAULT_USER_ROLE: user
    # true stores admin-UI config changes in the volume; false keeps Pulumi settings authoritative
    open-webui:ENABLE_PERSISTENT_CONFIG: false
    open-webui:image: ghcr.io/open-webui/open-webui:v0.12.5-slim
    # Model backends are configured in the Admin UI. When agentgateway is enabled,
    # its OpenAI-compatible endpoint is connected automatically.
    # Pocket ID groups allowed to sign in (unset = unrestricted)
    open-webui:auth/allowedGroups: admin,open-webui-users
    # open-webui:debug: false
    # OIDC (OAuth) login. Set open-webui:auth to an OIDC provider to enable (currently: pocket).
    # Requires orangelab:coreStackRef pointing at a core stack with the provider enabled.
    # open-webui:auth: pocket
    # open-webui:auth/clientId: CLIENT_ID
    # open-webui:auth/clientSecret: CLIENT_SECRET
    # open-webui:auth/providerUrl: https://pocket.example.com/.well-known/openid-configuration  # optional override; defaults to the core stack's provider export
    # open-webui:auth/providerName: SSO  # optional; label the login button, defaults to "SSO"

    kubeai:enabled: false
    kubeai:hostname: kubeai
    # Per-node model PVCs, separate from the Ollama volume
    kubeai:modelStoragePath: /srv/kubeai-models
    # Per-node model hosts: required GPU type, storage size and GPU env; see components/kubeai/kubeai.md
    # kubeai:modelNodes:
    #     <node>: {gpu: amd, storageSize: 50Gi, env: {HSA_OVERRIDE_GFX_VERSION: '11.0.0'}}
    # kubeai:huggingfaceToken: TOKEN
    # Model server images per engine and GPU. This is a YAML block string because
    # Pulumi project config does not accept object values. Overrides replace the
    # whole map: copy these entries and add yours. See components/kubeai/kubeai.md.
    kubeai:images: |
        ollama:
            amd: ollama/ollama:0.40.12-rocm
            nvidia: ollama/ollama:0.40.12

    invokeai:enabled: false
    invokeai:hostname: 'invokeai'
    invokeai:image: ghcr.io/invoke-ai/invokeai:latest
    invokeai:amd/image: ghcr.io/invoke-ai/invokeai:main-rocm
    invokeai:storageSize: 20Gi
    invokeai:storageClass: longhorn-node-local
    invokeai:gpu: nvidia
    # Pocket ID groups allowed to sign in (unset = unrestricted)
    invokeai:auth/allowedGroups: admin,invokeai-admin
    # invokeai:huggingfaceToken: TOKEN

    n8n:enabled: false
    n8n:hostname: n8n
    n8n:image: docker.n8n.io/n8nio/n8n:latest
    # n8n:N8N_ENCRYPTION_KEY: ''
    n8n:storageSize: 1Gi
    n8n:db/storageSize: 1Gi
    n8n:db/instances: 1
    # Database cpu and memory requests and limits, overriding the library default.
    # n8n:db/resources:
    #     value: {requests: {memory: 1Gi}, limits: {memory: 2Gi}}
    # Pocket ID groups allowed to sign in (unset = unrestricted)
    n8n:auth/allowedGroups: admin,n8n-users

    hermes:enabled: false
    hermes:hostname: hermes
    hermes:image: nousresearch/hermes-agent:v0.22.6
    hermes:storageSize: 5Gi
    hermes:kubectlVersion: v1.36.6
    hermes:ghVersion: 2.103.3
    # Fine-grained PAT for gh and git; read-only Contents is enough to start.
    # hermes:GITHUB_TOKEN: <token>
    # Token for the self-hosted forge, so the agent can push a branch and open a
    # PR there instead of asking a human to carry a patch. write:repository on
    # the repositories it works in is enough; it needs no admin rights.
    # hermes:FORGEJO_TOKEN: <token>
    # SOUL.md seeded into a new profile; relative paths resolve from stacks/ai.
    hermes:soulFile: components/hermes/SOUL.md
    # White Noise (Marmot/Nostr) connector as a sidecar; the platform config is
    # seeded into /opt/data/config.yaml when enabled.
    hermes:marmot/enabled: false
    hermes:marmot/version: 0.14.0
    # Contact allowlists: npub or 64-char hex, comma-separated; empty denies all.
    # hermes:marmot/welcomerAllowlist: <npub>
    # hermes:marmot/allowedUsers: <npub>
    # Default group for cron and `hermes send`; the chat id of the group you invited it to.
    # hermes:marmot/homeChannel: <group-id-hex>
    hermes:marmot/allowAllUsers: false
    # Model served by agentgateway; requires 'hermes' in agentgateway:clients.
    # hermes:model: assistant
    # Proxies allowed to set X-Forwarded-* for the dashboard (Pocket ID login).
    # These are the k3s defaults; override for a cluster with custom CIDRs.
    hermes:trustedProxies: '10.42.0.0/16,10.43.0.0/16'
    # Re-copy the seeded config.yaml on the next deploy, discarding dashboard edits.
    hermes:recreateConfig: false
    # Pocket ID groups allowed to sign in (unset = unrestricted)
    hermes:auth/allowedGroups: admin,hermes-admin
    # Dashboard password when Pocket ID is not used (generated when unset).
    # hermes:dashboard/password: <value>
    #
    # Pocket ID: run components/hermes/pocket-hermes.sh, then set these.
    # hermes:auth: pocket
    # hermes:auth/clientId: CLIENT_ID
