name: orangelab-bitcoin
main: index.ts
runtime:
    name: nodejs
    options:
        typescript: true
        packagemanager: npm
description: OrangeLab Bitcoin Stack
config:
    # Required shared defaults (duplicated from root Pulumi.yaml)
    # orangelab:routingProvider: tailscale | traefik
    mariadb-operator:enabled: false
    cloudnative-pg:enabled: false
    # longhorn:backupAllVolumes: false # read from the core stack by default

    # Default RPC users that will be created (comma-separated)
    bitcoin:rpcUsers: admin,electrs,mempool

    bitcoin-core:enabled: false
    bitcoin-core:hostname: bitcoin
    bitcoin-core:storageSize: 1000Gi
    bitcoin-core:storageClass: longhorn-large
    # bitcoin-core:externalip: <public-ip>
    bitcoin-core:maxconnections: 20
    bitcoin-core:prune: 0
    bitcoin-core:debug: false
    bitcoin-core:debugexclude: addrman,bench,estimatefee,leveldb,libevent,mempool,net,txpackages,validation
    bitcoin-core:image: btcpayserver/bitcoin:29.2
    bitcoin-core:commandArgs: bitcoind -datadir=/data
    bitcoin-core:volumePath: /data
    # (Optional) Override image ENTRYPOINT and set container user; required for non-btcpayserver images
    # bitcoin-core:command: bitcoind
    # bitcoin-core:runAsUser: 1000
    # bitcoin-core:volumeOwnerUserId: 1000
    # bitcoin-core:fixVolumePermissions: '-R' # '-R' recurse, '-Rv' verbose

    bitcoin-knots:enabled: false
    bitcoin-knots:hostname: bitcoin
    bitcoin-knots:storageSize: 1000Gi
    bitcoin-knots:storageClass: longhorn-large
    bitcoin-knots:prune: 0
    # bitcoin-knots:externalip: <public-ip>
    bitcoin-knots:maxconnections: 20
    bitcoin-knots:debug: false
    bitcoin-knots:debugexclude: addrman,bench,estimatefee,leveldb,libevent,mempool,net,txpackages,validation
    bitcoin-knots:image: ghcr.io/retropex/bitcoin:29.3.knots20260507@sha256:366a8d1a939b002291a134aee6e03d1a10379f8dead646f8d30b296b88ee8380
    bitcoin-knots:commandArgs: -datadir=/data
    bitcoin-knots:volumePath: /data
    # (Optional) Override image ENTRYPOINT and container user
    # bitcoin-knots:command: bitcoind
    # bitcoin-knots:runAsUser: 999
    # bitcoin-knots:volumeOwnerUserId: 999
    # bitcoin-knots:fixVolumePermissions: '-R' # '-R' recurse, '-Rv' verbose

    electrs:enabled: false
    electrs:storageSize: 200Gi
    electrs:storageClass: longhorn-large
    electrs:hostname: electrs
    electrs:image: getumbrel/electrs:v0.11.1

    mempool:enabled: false
    mempool:frontend/hostname: mempool
    mempool:frontend/image: mempool/frontend:v3.3.1
    mempool:backend/hostname: mempool-backend
    mempool:backend/image: mempool/backend:v3.3.1
    mempool:db/storageSize: 1Gi
