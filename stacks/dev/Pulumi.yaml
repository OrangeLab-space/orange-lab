name: orangelab-dev
main: index.ts
runtime:
    name: nodejs
    options:
        typescript: true
        packagemanager: npm
description: OrangeLab Development Stack
config:
    # Required: tailscale | traefik
    # orangelab:routingProvider: traefik

    orangelab:redis/image: docker.io/redis:8-alpine

    debug:enabled: false
    # debug:namespace: bitcoin
    # debug:fromVolume: bitcoin
    # debug:requiredNodeLabel: kubernetes.io/hostname=<host>
    # debug:exportPath: /export

    forgejo:enabled: false
    forgejo:hostname: forgejo
    forgejo:storageSize: 10Gi
    forgejo:db/type: sqlite # sqlite | postgres
    forgejo:db/storageSize: 5Gi
    forgejo:redis/enabled: false
    # Database cpu and memory requests and limits, overriding the library default.
    # forgejo:db/resources:
    #     value: {requests: {memory: 1Gi}, limits: {memory: 2Gi}}
    # forgejo:redis/resources:
    #     value: {requests: {memory: 128Mi}, limits: {memory: 256Mi}}
    forgejo:adminUsername: gitea_admin
    # forgejo:adminEmail: forgejo@example.com
    # forgejo:adminPassword:
    #   secure: <ADMIN_PASSWORD>
    forgejo:smtp/enabled: false
    # forgejo:smtp/host: smtp.example.com
    # forgejo:smtp/from: noreply@example.com
    # forgejo:smtp/username: user
    # forgejo:smtp/password:
    #   secure: <SMTP_PASSWORD>
    forgejo:smtp/port: 587
    forgejo:smtp/secure: starttls
    # Keep branches of a repository up to date with an upstream remote
    # (fast-forward only; a diverged branch fails the job instead of overwriting).
    forgejo:mirrorSync/enabled: false
    # forgejo:mirrorSync/upstreamUrl: https://github.com/example/project.git
    # forgejo:mirrorSync/repository: example/project
    # forgejo:mirrorSync/token:
    #   secure: <FORGEJO_TOKEN>
    # Only for a private upstream; a public one is fetched anonymously.
    # forgejo:mirrorSync/upstreamToken:
    #   secure: <UPSTREAM_TOKEN>
    # The reverse direction: push Forgejo's branches out to that same remote,
    # once the fetch above has finished. Unset pushUrl = only the fetch runs.
    # forgejo:mirrorSync/pushUrl: https://github.com/example/project.git
    # forgejo:mirrorSync/pushToken:
    #   secure: <REMOTE_TOKEN>
    forgejo:mirrorSync/branches: main
    forgejo:mirrorSync/pushBranches: 0.9.0
    forgejo:mirrorSync/schedule: '*/30 * * * *'
    forgejo:mirrorSync/image: docker.io/alpine/git:2.54.0
    # forgejo:auth: pocket
    # forgejo:auth/clientId: <client-id>
    # forgejo:auth/clientSecret:
    #   secure: <client-secret>
    # forgejo:auth/providerName: SSO
    # Pocket ID groups allowed to sign in (unset = unrestricted)
    forgejo:auth/allowedGroups: admin,forgejo-users,forgejo-admin
