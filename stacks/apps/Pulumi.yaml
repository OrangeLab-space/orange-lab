name: orangelab-apps
main: index.ts
runtime:
    name: nodejs
    options:
        typescript: true
        packagemanager: npm
description: OrangeLab Apps Stack
config:
    # Required shared defaults (duplicated from root Pulumi.yaml)
    # orangelab:routingProvider: tailscale | traefik
    mariadb-operator:enabled: false
    cloudnative-pg:enabled: false
    # longhorn:backupAllVolumes: false # read from the core stack by default
    orangelab:redis/image: docker.io/redis:8-alpine

    vaultwarden:enabled: false
    vaultwarden:hostname: vaultwarden
    vaultwarden:storageSize: 5Gi
    # vaultwarden:adminToken:
    #   secure: <ADMIN_TOKEN>
    # vaultwarden:smtp/host: smtp.example.com
    # vaultwarden:smtp/from: noreply@example.com
    # vaultwarden:smtp/username: user
    # vaultwarden:smtp/password:
    #   secure: <SMTP_PASSWORD>
    vaultwarden:smtp/enabled: false
    vaultwarden:smtp/port: 587
    vaultwarden:smtp/secure: starttls
    vaultwarden:signupsAllowed: false
    vaultwarden:signupsVerify: true

    nextcloud:enabled: false
    nextcloud:hostname: nextcloud
    nextcloud:storageSize: 20Gi
    nextcloud:db/storageSize: 5Gi
    nextcloud:trustedProxies: '10.42.0.0/16,10.43.0.0/16,127.0.0.0/8'
    nextcloud:groupProvisioningWhitelist: '^nextcloud-.*$'
    nextcloud:smtp/enabled: false
    # nextcloud:smtp/host: smtp.example.com
    # nextcloud:smtp/from: noreply@example.com
    # nextcloud:smtp/username: user
    # nextcloud:smtp/password:
    #   secure: <SMTP_PASSWORD>
    nextcloud:smtp/port: 587
    nextcloud:smtp/secure: starttls
    # nextcloud:auth: pocket
    # nextcloud:auth/clientId: <client-id>
    # nextcloud:auth/clientSecret:
    #   secure: <client-secret>
