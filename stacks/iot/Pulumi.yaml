name: orangelab-iot
main: index.ts
runtime:
    name: nodejs
    options:
        typescript: true
        packagemanager: npm
description: OrangeLab IoT Stack
config:
    # Required shared defaults (duplicated from root Pulumi.yaml)
    # orangelab:routingProvider: tailscale | traefik
    # longhorn:backupAllVolumes: false # read from the core stack by default

    ### IoT ###

    home-assistant:enabled: false
    home-assistant:hostname: home-assistant
    home-assistant:storageSize: 5Gi
    home-assistant:devices: []
    # mount additional host devices
    # home-assistant:devices:
    #     - name: usb-device
    #       device: /dev/ttyACM0
    # Set zone for deployment on nodes with topology.kubernetes.io/zone=<value> label
    # This gives access to sensors on local host network
    # home-assistant:requiredNodeLabel: topology.kubernetes.io/zone=<value>
    # or deploy to specific node
    # home-assistant:requiredNodeLabel: kubernetes.io/hostname=<value>
    home-assistant:trustedProxies: '10.42.0.0/16,10.43.0.0/16,127.0.0.0/8' # clusterCidr,serviceCidr,local
    # Home Assistant OpenID Connect integration source (used when home-assistant:auth is set)
    # Release archive is fetched from <oidcRepo>/releases/download/<oidcVersion>/hass-oidc-auth.zip
    home-assistant:oidcRepo: https://github.com/christiaangoossens/hass-oidc-auth
    home-assistant:oidcVersion: v1.2.1
    # Frigate custom integration, installed into /config/custom_components
    # when the Frigate component is enabled (repo + release tag, fetched from a tarball)
    home-assistant:frigateRepo: https://github.com/blakeblackshear/frigate-hass-integration
    home-assistant:frigateVersion: v5.15.6

    openthread:enabled: false
    openthread:storageSize: 1Gi
    openthread:image: openthread/border-router:latest
    # Set node-specific values (infra iface, RCP device path with /dev/serial/by-id
    # preferred, node pinning) in your stack config, e.g.:
    # openthread:OT_INFRA_IF: wlan0
    # openthread:device: /dev/ttyACM0

    matter:enabled: false
    matter:hostname: matter
    matter:storageSize: 1Gi
    matter:image: ghcr.io/matter-js/matterjs-server:stable
    # Host Bluetooth adapter index used for BLE commissioning (set to -1 to disable)
    matter:bluetoothAdapter: 0
    # (Optional) Primary network interface for Matter mDNS
    # matter:primaryInterface: enp3s0

    mosquitto:enabled: false
    mosquitto:image: eclipse-mosquitto:2
    mosquitto:user: mqtt
    mosquitto:storageSize: 1Gi
    # Required: set with `pulumi config set --secret mosquitto:password <value>`
    # Generate one with: openssl rand -base64 24

    frigate:enabled: false
    frigate:hostname: frigate
    # With frigate:gpu set the tag is managed (append -tensorrt / -rocm); to pin a
    # tag yourself, leave frigate:gpu unset and set the full tag here.
    frigate:image: ghcr.io/blakeblackshear/frigate
    frigate:storageSize: 5Gi
    frigate:media/storageSize: 50Gi
    frigate:shmSize: 512Mi
    frigate:cacheSize: 1Gi
    frigate:coral: false
    # GPU: nvidia | amd | intel. See frigate.md for the AMD iGPU chipset override.
    # frigate:gpu: nvidia
    # Deploy on the node with the Coral USB accelerator / recorded media disk.
    # frigate:requiredNodeLabel: kubernetes.io/hostname=<node>
    # Store recordings on a local disk instead of Longhorn.
    # frigate:media/hostPath: /mnt/media/frigate
    # Extra host devices, e.g. an iGPU for hardware-accelerated decoding.
    # frigate:devices:
    #     - name: dri
    #       device: /dev/dri
    # Frigate config (YAML). Holds camera credentials in plaintext - use
    # `pulumi config set --secret frigate:config "$(cat frigate.yml)"` instead.
    # frigate:config: {}
    # After first deploy the UI owns config.yml, so the seed above is ignored
    # until this is true. Set back to false afterwards.
    frigate:config/recreate: false
    # Single sign-on via Pocket ID. Create the OIDC client first with
    # ./components/frigate/pocket-frigate.sh. See frigate.md.
    # Pocket ID groups mapped to Frigate roles (Frigate role -> list of groups).
    frigate:auth/groupMap:
        value:
            admin:
                - admin
            # viewer:
            #     - viewers
    # Fallback role for authenticated users not matched above (admin | viewer).
    frigate:auth/defaultRole: viewer
